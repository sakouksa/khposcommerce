<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="suppBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="facTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="facLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="facRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="bayAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="suppDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Card Background (Identical to default-product.svg) -->
  <rect width="400" height="400" rx="32" fill="url(#suppBg)" />
  <rect x="1" y="1" width="398" height="398" rx="31" stroke="#E2E8F0" stroke-width="2" />

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="305" rx="105" ry="24" fill="#0F172A" fill-opacity="0.06" />

  <!-- 3D Isometric Supplier Facility (Clean, Minimalist) -->
  <g filter="url(#suppDrop)">
    <!-- Roof Top Face -->
    <path d="M200 115 L280 160 L200 205 L120 160 Z" fill="url(#facTop)" />
    <!-- Left Wall -->
    <path d="M120 160 L200 205 L200 280 L120 235 Z" fill="url(#facLeft)" />
    <!-- Right Wall -->
    <path d="M200 205 L280 160 L280 235 L200 280 Z" fill="url(#facRight)" />

    <!-- Minimalist Supply Bay / Logistics Entrance -->
    <polygon points="145,208 175,224 175,264 145,248" fill="url(#bayAccent)" />
    <polygon points="147,211 173,225 173,262 147,247" fill="#0369A1" fill-opacity="0.25" />

    <!-- Clean Edge Accent Lines -->
    <path d="M200 115 L280 160 L200 205 L120 160 Z" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5" />
    <line x1="200" y1="205" x2="200" y2="280" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
  </g>
</svg>
