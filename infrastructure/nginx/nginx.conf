# KHPosCommerce Unified Gateway & Reverse Proxy Configuration
# Routes:
#   - /api/          -> Laravel Backend API (Port 8001 / PHP-FPM)
#   - /admin/        -> React Admin Dashboard & Web POS (Port 5174)
#   - /              -> React Customer Storefront (Port 5173)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression for high performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Upstreams for micro-services / apps
    upstream backend_api {
        server 127.0.0.1:8001;
        keepalive 32;
    }

    upstream admin_pos {
        server 127.0.0.1:5174;
    }

    upstream storefront_web {
        server 127.0.0.1:5173;
    }

    server {
        listen 80;
        server_name localhost dev.khposcommerce.local;

        client_max_body_size 64M;

        # 1. Backend REST API Routing
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # 2. Admin & Web POS Dashboard Routing
        location /admin/ {
            proxy_pass http://admin_pos;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # 3. Customer Storefront Routing (Default root)
        location / {
            proxy_pass http://storefront_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Health Check Endpoint for Load Balancers
        location /health {
            access_log off;
            return 200 '{"status":"ok","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }
    }
}
