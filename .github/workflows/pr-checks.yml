name: PR Quality Gate & Security Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-lint:
    name: Validate PR Title & Scope
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
