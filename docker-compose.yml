version: '3.9'

services:
  # ─── PHP-FPM (Laravel) ───────────────────────────────────────────────────────
  app:
    build:
      context: ./api/backend-khposcommerce
      dockerfile: docker/Dockerfile
    container_name: enterprise_pos_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./api/backend-khposcommerce:/var/www
      - ./api/backend-khposcommerce/docker/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
    networks:
      - enterprise_pos_net
    depends_on:
      - db
      - redis

  # ─── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: enterprise_pos_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./api/backend-khposcommerce:/var/www
      - ./api/backend-khposcommerce/docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - enterprise_pos_net
    depends_on:
      - app

  # ─── PostgreSQL 16 ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: enterprise_pos_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-enterprise_pos}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-12345678}
    volumes:
      - enterprise_pos_db_data:/var/lib/postgresql/data
    networks:
      - enterprise_pos_net

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: enterprise_pos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - enterprise_pos_redis_data:/data
    networks:
      - enterprise_pos_net

  # ─── Queue Worker ─────────────────────────────────────────────────────────────
  queue:
    build:
      context: ./api/backend-khposcommerce
      dockerfile: docker/Dockerfile
    container_name: enterprise_pos_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./api/backend-khposcommerce:/var/www
    networks:
      - enterprise_pos_net
    depends_on:
      - db
      - redis

  # ─── Scheduler ───────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: ./api/backend-khposcommerce
      dockerfile: docker/Dockerfile
    container_name: enterprise_pos_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./api/backend-khposcommerce:/var/www
    networks:
      - enterprise_pos_net
    depends_on:
      - db
      - redis

  # ─── Admin Portal (React) ─────────────────────────────────────────────────────
  admin:
    image: node:20-alpine
    container_name: enterprise_pos_admin
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5174:5174"
    volumes:
      - ./webclient/admin-khposcommerce:/app
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    networks:
      - enterprise_pos_net

  # ─── Customer Storefront (React) ──────────────────────────────────────────────
  website:
    image: node:20-alpine
    container_name: enterprise_pos_website
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./webclient/storefront-khposcommerce:/app
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    networks:
      - enterprise_pos_net

networks:
  enterprise_pos_net:
    driver: bridge

volumes:
  enterprise_pos_db_data:
  enterprise_pos_redis_data:
