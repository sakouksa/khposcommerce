version: '3.9'

services:
  # ─── 1. PostgreSQL 16 (Private Network Only) ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: enterprise_pos_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-enterprise_pos}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_prod_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - enterprise_pos_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-enterprise_pos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 2. Redis 7 (Private Network Only) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: enterprise_pos_redis_prod
    restart: unless-stopped
    command: >
      redis-server --requirepass "${REDIS_PASSWORD:-secure_redis_password}"
                   --maxmemory 512mb
                   --maxmemory-policy allkeys-lru
                   --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - enterprise_pos_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secure_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 3. Laravel 12 Backend API (PHP 8.3-FPM + Supervisor Queues/Cron) ─────────
  backend:
    build:
      context: ./api/backend-khposcommerce
      dockerfile: docker/Dockerfile.prod
    container_name: enterprise_pos_backend_prod
    restart: unless-stopped
    env_file:
      - ./api/backend-khposcommerce/.env.production
    volumes:
      - backend_storage:/var/www/storage
    networks:
      - enterprise_pos_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── 4. React Admin Portal (SPA) ─────────────────────────────────────────────
  admin:
    build:
      context: ./webclient/admin-khposcommerce
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${ADMIN_VITE_API_URL:-https://api.example.com/api/v1}
    container_name: enterprise_pos_admin_prod
    restart: unless-stopped
    networks:
      - enterprise_pos_internal

  # ─── 5. React Customer Storefront (SPA) ──────────────────────────────────────
  website:
    build:
      context: ./webclient/storefront-khposcommerce
      dockerfile: Dockerfile
      args:
        VITE_STORE_API_URL: ${WEBSITE_VITE_STORE_API_URL:-https://api.example.com/api/v1/store}
        VITE_API_URL: ${WEBSITE_VITE_API_URL:-https://api.example.com/api/v1}
    container_name: enterprise_pos_website_prod
    restart: unless-stopped
    networks:
      - enterprise_pos_internal

  # ─── 6. Master Nginx Gateway (Public Reverse Proxy + TLS 1.3 Termination) ────
  gateway:
    image: nginx:1.25-alpine
    container_name: enterprise_pos_gateway_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_storage:/var/www/storage:ro
      - ./infrastructure/docker/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - enterprise_pos_internal
    depends_on:
      - backend
      - admin
      - website

networks:
  enterprise_pos_internal:
    driver: bridge
    internal: false

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_storage:
    driver: local
  certbot_www:
    driver: local
