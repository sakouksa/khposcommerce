version: '3.9'

services:
  # ─── 1. PostgreSQL 16 (Staging) ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: enterprise_pos_postgres_staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-enterprise_pos_staging}
      POSTGRES_USER: ${DB_USERNAME:-postgres_staging}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-staging_db_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    networks:
      - enterprise_pos_staging_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres_staging} -d ${DB_DATABASE:-enterprise_pos_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 2. Redis 7 (Staging) ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: enterprise_pos_redis_staging
    restart: unless-stopped
    command: >
      redis-server --requirepass "${REDIS_PASSWORD:-staging_redis_password}"
                   --maxmemory 256mb
                   --maxmemory-policy allkeys-lru
    volumes:
      - redis_staging_data:/data
    networks:
      - enterprise_pos_staging_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-staging_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 3. Backend API (Staging) ───────────────────────────────────────────────
  backend:
    build:
      context: ./api/backend-khposcommerce
      dockerfile: docker/Dockerfile.prod
    container_name: enterprise_pos_backend_staging
    restart: unless-stopped
    env_file:
      - ./api/backend-khposcommerce/.env.staging
    volumes:
      - backend_staging_storage:/var/www/storage
    networks:
      - enterprise_pos_staging_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── 4. Admin Portal (Staging) ───────────────────────────────────────────────
  admin:
    build:
      context: ./webclient/admin-khposcommerce
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${ADMIN_VITE_API_URL:-https://api-staging.example.com/api/v1}
    container_name: enterprise_pos_admin_staging
    restart: unless-stopped
    networks:
      - enterprise_pos_staging_net

  # ─── 5. Customer Storefront (Staging) ────────────────────────────────────────
  website:
    build:
      context: ./webclient/storefront-khposcommerce
      dockerfile: Dockerfile
      args:
        VITE_STORE_API_URL: ${WEBSITE_VITE_STORE_API_URL:-https://api-staging.example.com/api/v1/store}
        VITE_API_URL: ${WEBSITE_VITE_API_URL:-https://api-staging.example.com/api/v1}
    container_name: enterprise_pos_website_staging
    restart: unless-stopped
    networks:
      - enterprise_pos_staging_net

  # ─── 6. Staging Nginx Gateway ───────────────────────────────────────────────
  gateway:
    image: nginx:1.25-alpine
    container_name: enterprise_pos_gateway_staging
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./infrastructure/docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_staging_storage:/var/www/storage:ro
      - ./infrastructure/docker/ssl:/etc/nginx/ssl:ro
    networks:
      - enterprise_pos_staging_net
    depends_on:
      - backend
      - admin
      - website

networks:
  enterprise_pos_staging_net:
    driver: bridge

volumes:
  postgres_staging_data:
  redis_staging_data:
  backend_staging_storage:
